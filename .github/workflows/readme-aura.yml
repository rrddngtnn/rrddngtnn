name: Generate README

on:
  schedule:
    # Daily at 03:17 UTC (10:17 WIB); GitHub may delay scheduled jobs.
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'README.source.md'
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/readme-aura.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-generate
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      # Resolve the official composite action locally: GitHub's remote composite
      # expansion returned an internal server error before starting any job.
      - name: Checkout official generator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: stats-organization/github-readme-stats-action
          ref: 2c498845f71017821efaad14293ebc736156ef21
          path: .upstream-grs-action
          persist-credentials: false

      - name: Verify source layout and publication guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Generate standard stats card
        uses: ./.upstream-grs-action
        with:
          card: stats
          options: username=rrddngtnn&bg_color=091722&title_color=83d9f2&text_color=e3faff&icon_color=b7e7f3&border_color=1b4358&show_icons=true
          path: .github/assets/stats.svg
          core_version: '2.3.0'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate standard top-langs card
        uses: ./.upstream-grs-action
        with:
          card: top-langs
          options: username=rrddngtnn&bg_color=091722&title_color=83d9f2&text_color=e3faff&icon_color=b7e7f3&border_color=1b4358&layout=compact&langs_count=6
          path: .github/assets/top-langs.svg
          core_version: '2.3.0'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate cards and publish source
        run: python3 scripts/generate_readme.py

      - name: Commit generated output only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/assets
          if git diff --cached --quiet; then
            printf 'Cards are already up to date.\n'
            exit 0
          fi
          git commit -m 'chore(readme): refresh standard GitHub Readme Stats cards'
          git pull --rebase origin main
          git push origin HEAD:main
