name: Generate README

on:
  schedule:
    # Daily at 03:17 UTC (10:17 WIB); GitHub may delay scheduled jobs.
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'README.source.md'
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/readme-aura.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-generate
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify fail-closed guards and source layout
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Generate and validate cards with live public data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_readme.py

      - name: Commit generated output only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/assets
          if git diff --cached --quiet; then
            printf 'Cards are already up to date.\n'
            exit 0
          fi
          git commit -m 'chore(readme): refresh live public GitHub stats and cards'
          git pull --rebase origin main
          git push origin HEAD:main
