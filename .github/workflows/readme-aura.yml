name: Generate README
on:
  schedule:
    # Daily 03:17 UTC; scheduled runs can be delayed by GitHub.
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['README.source.md', 'icons/**', 'scripts/**', '.github/workflows/readme-aura.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Set up PHP for official streak generator
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, curl
          tools: composer:2
          coverage: none
      - name: Verify source layout and publication guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      # Invoke upstream entry points directly, avoiding remote nested-composite
      # expansion (GitHub previously failed before allocating any job).
      - name: Generate official cards with authenticated GitHub data
        run: bash scripts/generate_upstream.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit validated generated output only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(readme): refresh standard profile cards'
          git pull --rebase origin main
          git push origin HEAD:main
