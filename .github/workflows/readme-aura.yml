name: Generate README

on:
  push:
    branches: [main]
    paths:
      - 'README.source.md'
      - 'icons/**'
      - '.github/workflows/readme-aura.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          source: README.source.md
          output: README.md
          assets_dir: .github/assets
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user: rrddngtnn
          auto_commit: 'true'
          commit_message: 'chore(readme): regenerate cards from README.source.md'
